apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: ssaliman-root-ca
spec:
  selfSigned: {}
---
# create the root certificate
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: root-ca
  namespace: cert-manager
spec:
  isCA: true
  secretName: root-ca
  duration: 87600h # 10 years
  commonName: ssaliman-root-ca
  privateKey:
    algorithm: RSA
    size: 2048
  issuerRef:
    name: ssaliman-root-ca
    kind: ClusterIssuer
---
# Create the certificate issuer that uses the root certificate
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  # name: letsencrypt-prod
  # name: self-signed
  name: saliman-ca
spec:
  ca:
    secretName: saliman-root-ca
  #acme:
  #  server: https://acme-v02.api.letsencrypt.org/directory
  #  privateKeySecretRef:
  #    name: letsencrypt-prod
  #  solvers:
  #  - dns01:
  #      cloudflare:
  #        apiTokenSecretRef:
  #          name: cloudflare-api-token
  #          key: api-token
---
# Put it in the global-secrets namespace
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: root-ca
  namespace: global-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: cluster-secrets
    kind: ClusterSecretStore
  target:
    name: root-ca
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        ca.crt: "{{ .tls_crt }}"
  data:
    - secretKey: tls_crt
      remoteRef:
        key: root-ca
        property: tls.crt
