# create the root certificate
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: saliman-root-cert
  namespace: cert-manager
spec:
  isCA: true
  secretName: saliman-root-cert
  duration: 87600h # 10 years
  commonName: saliman-root-cert
  privateKey:
    algorithm: RSA
    size: 2048
  issuerRef:
    name: saliman-root-ca
    kind: Issuer
