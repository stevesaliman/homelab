- name: Bootstrapping the cluster
  hosts: localhost
  tasks:
    - name: Create ArgoCD namespace
      kubernetes.core.k8s:
        api_version: v1
        kind: Namespace
        name: argocd
        state: present

    # There are two ArgoCD manifests in the project.  a "seed" manifest to do the initial
    # deployment, and the final one, which uses some of the applications installed by the seed
    # manifest.  The final version relies on system monitoring and the ingress service to work.
    # Check to see which one to use base on whether the ingress (the last of the prerequisites to
    # be installed) is running.
    - name: Check if this is the first installation
      kubernetes.core.k8s_info:
        kind: Pod
        label_selectors:
          - app.kubernetes.io/instance=ingress-nginx
        field_selectors:
          - status.phase=Running
      register: ingress_running

    - name: Do we have in ingres?
      debug:
        msg: "Ingress running? {{ ingress_running.resources | length != 0 }}"

    # The original task, which used gitea to switch manifests.  Khuedoan used this because his
    # final manifest switched from github to internal hosting on gitea at this point.
    # Check if this is the first run by getting info for the gitea pod.
#    - name: Check if this is the first installation
#      kubernetes.core.k8s_info:
#        kind: Pod
#        label_selectors:
#          - app.kubernetes.io/instance=gitea
#        field_selectors:
#          - status.phase=Running
#      register: gitea_running

    # If the ingress pod isn't running (the phase array from above is empty), run the Helm chart to
    # install Argo with "seed" values that deploy all the apps in the GitHub repo, that sit under
    # system, platform, or apps.  Otherwise, use the values file that include monitoring and use the
    # ingress.
    - name: Render ArgoCD manifests from Helm chart
      kubernetes.core.helm_template:
        chart_ref: ./argocd
        include_crds: true
        release_name: argocd
        release_namespace: argocd
        dependency_update: true
        values_files:
          - "argocd/{{ (ingress_running.resources | length == 0) | ternary('values-seed.yaml', 'values.yaml') }}"
      register: argocd_manifests

    - name: show manifest
      ansible.builtin.copy:
        content: "{{ argocd_manifests.stdout }}"
        dest: argocd_manifests.yml

    - name: Apply ArgoCD manifests
      kubernetes.core.k8s:
        resource_definition: "{{ argocd_manifests.stdout }}"
        apply: true
        server_side_apply:
          field_manager: argocd-controller
